<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;700&display=swap');
        
        :root {
            --primary: #0A0E27;
            --accent: #00F0FF;
            --accent-alt: #FF006E;
            --surface: #1A1F3A;
            --text: #E8EBF7;
            --text-muted: #8B92B0;
            --glow: rgba(0, 240, 255, 0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, #050714 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.5; }
        }
        
        .container {
            max-width: 1000px;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        
        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: slideDown 0.8s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-alt) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        
        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 500;
        }
        
        .card {
            background: var(--surface);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 
                        0 0 0 1px rgba(255, 255, 255, 0.05);
            animation: fadeIn 1s ease-out 0.2s backwards;
            position: relative;
            overflow: hidden;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent-alt));
        }
        
        .input-group {
            margin-bottom: 2rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.75rem;
            font-weight: 700;
            color: var(--text);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        input[type="text"],
        input[type="url"] {
            width: 100%;
            padding: 1rem 1.25rem;
            background: var(--primary);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }
        
        input[type="text"]:focus,
        input[type="url"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--glow);
        }
        
        input::placeholder {
            color: var(--text-muted);
        }
        
        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        
        button {
            flex: 1;
            min-width: 140px;
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        button:hover::before {
            left: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, #00C4D4 100%);
            color: var(--primary);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 240, 255, 0.4);
        }
        
        .btn-secondary {
            background: var(--primary);
            color: var(--text);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:hover {
            border-color: var(--accent);
            background: rgba(0, 240, 255, 0.1);
        }
        
        .btn-accent {
            background: linear-gradient(135deg, var(--accent-alt) 0%, #D4005E 100%);
            color: white;
        }
        
        .btn-accent:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 0, 110, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        #qrcode {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 320px;
            padding: 2rem;
            background: white;
            border-radius: 16px;
            margin-bottom: 2rem;
            position: relative;
        }
        
        .qr-label {
            color: var(--primary);
            font-weight: 700;
            text-align: center;
            width: 100%;
            padding: 0.5rem;
            word-wrap: break-word;
        }
        
        .qr-label-top {
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }
        
        .qr-label-bottom {
            font-size: 0.95rem;
            margin-top: 1rem;
        }
        
        #qrcode canvas,
        #qrcode img {
            max-width: 100%;
            height: auto;
            animation: zoomIn 0.5s ease-out;
        }
        
        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .placeholder {
            color: #999;
            font-size: 1.1rem;
            font-weight: 500;
            text-align: center;
        }
        
        .notification {
            position: fixed;
            top: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, var(--accent) 0%, #00C4D4 100%);
            color: var(--primary);
            border-radius: 12px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(0, 240, 255, 0.4);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        @media print {
            body {
                background: white;
            }
            
            body::before,
            .header,
            .input-group,
            .button-group,
            .notification {
                display: none !important;
            }
            
            .card {
                box-shadow: none;
                background: white;
                padding: 0;
            }
            
            #qrcode {
                margin: 0;
                padding: 2rem;
                page-break-inside: avoid;
            }
        }
        
        @media (max-width: 768px) {
            .card {
                padding: 2rem 1.5rem;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>QR Generator</h1>
            <p class="subtitle">Transform any text or URL into a scannable QR code</p>
        </div>
        
        <div class="card">
            <div class="input-group">
                <label for="text">Enter Text or URL</label>
                <input 
                    type="text" 
                    id="text" 
                    placeholder="https://example.com or any text..."
                    autocomplete="off"
                >
            </div>
            
            <div class="input-group">
                <label for="labelTop">Label (Above QR Code) - Optional</label>
                <input 
                    type="text" 
                    id="labelTop" 
                    placeholder="e.g., Scan to visit our website"
                    autocomplete="off"
                >
            </div>
            
            <div class="input-group">
                <label for="labelBottom">Label (Below QR Code) - Optional</label>
                <input 
                    type="text" 
                    id="labelBottom" 
                    placeholder="e.g., www.example.com"
                    autocomplete="off"
                >
            </div>
            
            <div class="button-group">
                <button class="btn-primary" onclick="generateQR()">Generate QR Code</button>
                <button class="btn-secondary" onclick="copyToClipboard()" id="copyBtn" disabled>Copy Image</button>
                <button class="btn-accent" onclick="printQR()" id="printBtn" disabled>Print</button>
            </div>
            
            <div id="qrcode">
                <div class="placeholder">Your QR code will appear here</div>
            </div>
        </div>
    </div>
    
    <div class="notification" id="notification"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        let qrCodeInstance = null;
        
        // Generate QR code
        function generateQR() {
            const text = document.getElementById('text').value.trim();
            const labelTop = document.getElementById('labelTop').value.trim();
            const labelBottom = document.getElementById('labelBottom').value.trim();
            
            if (!text) {
                showNotification('Please enter some text or URL', false);
                return;
            }
            
            const qrcodeContainer = document.getElementById('qrcode');
            qrcodeContainer.innerHTML = '';
            
            // Add top label if provided
            if (labelTop) {
                const topLabel = document.createElement('div');
                topLabel.className = 'qr-label qr-label-top';
                topLabel.textContent = labelTop;
                qrcodeContainer.appendChild(topLabel);
            }
            
            // Create container for QR code
            const qrContainer = document.createElement('div');
            qrContainer.id = 'qr-code-image';
            qrcodeContainer.appendChild(qrContainer);
            
            // Create new QR code
            qrCodeInstance = new QRCode(qrContainer, {
                text: text,
                width: 280,
                height: 280,
                colorDark: '#0A0E27',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });
            
            // Add bottom label if provided
            if (labelBottom) {
                const bottomLabel = document.createElement('div');
                bottomLabel.className = 'qr-label qr-label-bottom';
                bottomLabel.textContent = labelBottom;
                qrcodeContainer.appendChild(bottomLabel);
            }
            
            // Enable copy and print buttons
            document.getElementById('copyBtn').disabled = false;
            document.getElementById('printBtn').disabled = false;
            
            showNotification('QR code generated successfully!', true);
        }
        
        // Copy QR code to clipboard
        async function copyToClipboard() {
            const qrcodeContainer = document.getElementById('qrcode');
            const canvas = qrcodeContainer.querySelector('canvas');
            const img = qrcodeContainer.querySelector('img');
            
            if (!canvas && !img) {
                showNotification('Please generate a QR code first', false);
                return;
            }
            
            try {
                // Create a canvas with the entire QR code container including labels
                const finalCanvas = await createCanvasWithLabels(qrcodeContainer);
                
                finalCanvas.toBlob(async (blob) => {
                    try {
                        await navigator.clipboard.write([
                            new ClipboardItem({
                                'image/png': blob
                            })
                        ]);
                        showNotification('QR code copied to clipboard!', true);
                    } catch (err) {
                        // Fallback: copy as data URL
                        const dataUrl = finalCanvas.toDataURL();
                        const tempInput = document.createElement('input');
                        tempInput.value = dataUrl;
                        document.body.appendChild(tempInput);
                        tempInput.select();
                        document.execCommand('copy');
                        document.body.removeChild(tempInput);
                        showNotification('QR code data copied!', true);
                    }
                });
            } catch (err) {
                showNotification('Failed to copy. Please try again.', false);
            }
        }
        
        // Create canvas with labels
        async function createCanvasWithLabels(container) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const padding = 40;
            
            // Get QR code image
            const qrCanvas = container.querySelector('canvas');
            const qrImg = container.querySelector('img');
            const qrSource = qrCanvas || qrImg;
            
            // Get labels
            const topLabel = container.querySelector('.qr-label-top');
            const bottomLabel = container.querySelector('.qr-label-bottom');
            
            // Set canvas dimensions
            const qrSize = 280;
            let totalHeight = qrSize + (padding * 2);
            
            // Measure text heights
            ctx.font = 'bold 18px "DM Sans", sans-serif';
            const topText = topLabel ? topLabel.textContent : '';
            const topTextHeight = topText ? 30 : 0;
            
            ctx.font = 'bold 15px "DM Sans", sans-serif';
            const bottomText = bottomLabel ? bottomLabel.textContent : '';
            const bottomTextHeight = bottomText ? 25 : 0;
            
            totalHeight += topTextHeight + bottomTextHeight;
            canvas.width = qrSize + (padding * 2);
            canvas.height = totalHeight;
            
            // Fill white background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            let currentY = padding;
            
            // Draw top label
            if (topText) {
                ctx.fillStyle = '#0A0E27';
                ctx.font = 'bold 18px "DM Sans", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(topText, canvas.width / 2, currentY + 18);
                currentY += topTextHeight;
            }
            
            // Draw QR code
            if (qrCanvas) {
                ctx.drawImage(qrCanvas, padding, currentY, qrSize, qrSize);
            } else if (qrImg) {
                await new Promise((resolve) => {
                    const tempImg = new Image();
                    tempImg.onload = () => {
                        ctx.drawImage(tempImg, padding, currentY, qrSize, qrSize);
                        resolve();
                    };
                    tempImg.src = qrImg.src;
                });
            }
            currentY += qrSize;
            
            // Draw bottom label
            if (bottomText) {
                ctx.fillStyle = '#0A0E27';
                ctx.font = 'bold 15px "DM Sans", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(bottomText, canvas.width / 2, currentY + 20);
            }
            
            return canvas;
        }
        
        // Print QR code
        function printQR() {
            const canvas = document.querySelector('#qrcode canvas');
            const img = document.querySelector('#qrcode img');
            
            if (!canvas && !img) {
                showNotification('Please generate a QR code first', false);
                return;
            }
            
            window.print();
        }
        
        // Show notification
        function showNotification(message, success) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        // Allow Enter key to generate
        document.getElementById('text').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                generateQR();
            }
        });
    </script>
</body>
</html>
