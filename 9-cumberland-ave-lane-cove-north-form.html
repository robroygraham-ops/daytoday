<!DOCTYPE html>
<html>
<head>

<style>
body{font-family:Arial;background:#5f7a94;min-height:100vh;padding:20px;margin:0}
.container{max-width:900px;margin:0 auto;background:white;border-radius:15px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,0.2)}
.header{background:linear-gradient(135deg,#4facfe,#00f2fe);color:white;padding:30px;text-align:center}
.header h1{font-size:2em;margin:0}

.buttons{display:flex;gap:8px}
.btn{padding:8px 20px;border:none;border-radius:20px;font-weight:bold;cursor:pointer;font-size:0.95em}
.btn-yes{background:#4caf50;color:white}
.btn-no{background:#f44336;color:white}
.btn.active{box-shadow:0 0 0 3px rgba(0,0,0,0.2);transform:scale(1.05)}
.btn.inactive{background:#ccc;opacity:0.5}
.submit-btn{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:15px 40px;border:none;border-radius:25px;font-size:1.2em;font-weight:bold;cursor:pointer;margin:20px auto;display:block}
.message{padding:15px;margin-bottom:20px;border-radius:8px;text-align:center;font-weight:bold}
.success{background:#d4edda;color:#155724}
.error{background:#f8d7da;color:#721c24}
.link-box{background:#e3f2fd;padding:15px;border-radius:8px;margin-top:20px;text-align:center}
.link-box a{color:#1976d2;text-decoration:none;font-weight:bold;font-size:1.1em}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>Daytoday Real Time SOW Status Form</h1>
<h2>Site: 9-cumberland-ave-lane-cove-north</h2>
<p id="formDate" style="margin:10px 0 0 0;font-size:1.1em;opacity:0.95"></p>
</div>
<div class="content">
<div id="msg"></div>
<div id="form"></div>
<button class="submit-btn" onclick="submitForm()">Submit Form</button>

</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL="https://hkrktfmvxgctjeivmobz.supabase.co";
var SUPABASE_KEY="sb_publishable_a5_CAmMfSQrlVzUy3YhUWw_IQHb4RBy";
var SITE_ID="9-cumberland-ave-lane-cove-north";
var SITE_NAME="9-cumberland-ave-lane-cove-north";
var supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var questions=[
{id:"q1",label:"Air blowing footpath and driveways, and collecting foliage - Fortnightly"},
{id:"q2",label:"Mopping floors - Fortnightly"},
{id:"q3",label:"Polishing Lift and Lift tracks - Fortnightly"},
{id:"q4",label:"Wiping down balustrades, and handrails - Fortnightly"},
{id:"q5",label:"Wiping down light fittings - As required"},
{id:"q6",label:"Removing cobwebs throughout the SP - Fortnightly"},
{id:"q7",label:"Collecting rubbish throughout the SP - Fortnightly"},
{id:"q8",label:"Wiping down letterboxes and removing junk mail - Fortnightly"},
{id:"q9",label:"Clearing stormwater drains - Fortnightly"},
{id:"q10",label:"Relocating bins for collections and returning the next day, Thursday to Friday Yellow, Blue, and Red bins are weekly. Green bins are fortnightly. - Weekly"},
{id:"q11",label:"Washing bins and bin room - Weekly"},
{id:"q12",label:"Washing the carpark - Quarterly"},
{id:"q1768464081907",label:"Heavy-duty scrubbing of all tiles - Quarterly"},
{id:"q1768464090062",label:"Sweeping fire stairs - Quarterly"}
];
var answers={};
function renderForm(){var html="";for(var i=0;i<questions.length;i++){var q=questions[i];
var ans=answers[q.id];
var yc=(ans===true)?"active":((ans===false)?"inactive":"");
var nc=(ans===false)?"active":((ans===true)?"inactive":"");
html+="<div class=\"question\">";
html+="<label>"+q.label+"</label>";
html+="<div class=\"buttons\">";
html+="<button type=\"button\" class=\"btn btn-yes "+yc+"\" onclick=\"setAnswer('"+q.id+"',true)\">Yes</button>";
html+="<button type=\"button\" class=\"btn btn-no "+nc+"\" onclick=\"setAnswer('"+q.id+"',false)\">No</button>";
html+="</div></div>";}
document.getElementById("form").innerHTML=html;}
function setAnswer(qid,val){answers[qid]=val;renderForm();}
function showMsg(text,type){var box=document.getElementById("msg");
box.innerHTML="<div class=\"message "+type+"\">"+text+"</div>";
if(type==="success")setTimeout(function(){box.innerHTML="";},3000);}
function submitForm(){var missing=[];
for(var i=0;i<questions.length;i++){if(answers[questions[i].id]===undefined)missing.push(questions[i]);}
if(missing.length>0){showMsg("Please answer all questions ("+missing.length+" remaining)","error");return;}
supabase.from("submissions").insert({site_id:SITE_ID,site_name:SITE_NAME,responses:answers,timestamp:new Date().toISOString()}).then(function(result){
if(result.error){showMsg("Error: "+result.error.message,"error");}
else{alert("Form submitted successfully!");}});}
function loadTodaySubmission(){
var today=new Date();
var startOfDay=new Date(today.getFullYear(),today.getMonth(),today.getDate()).toISOString();
var endOfDay=new Date(today.getFullYear(),today.getMonth(),today.getDate()+1).toISOString();
supabase.from("submissions").select("*").eq("site_id",SITE_ID).gte("timestamp",startOfDay).lt("timestamp",endOfDay).order("timestamp",{ascending:false}).limit(1).then(function(result){
if(result.data&&result.data.length>0){
var latestResponses=result.data[0].responses;
for(var key in latestResponses){answers[key]=(latestResponses[key]===true||latestResponses[key]==="true");}
}
renderForm();
});}
loadTodaySubmission();
var today=new Date();
document.getElementById("formDate").textContent=today.toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
</script>
