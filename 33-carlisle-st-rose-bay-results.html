<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Results - 33-carlisle-st-rose-bay</title>
<style>
body{font-family:Arial;background:#5f7a94;min-height:100vh;padding:20px;margin:0}
.container{max-width:1200px;margin:0 auto;background:white;border-radius:15px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,0.2)}
.header{background:linear-gradient(135deg,#ff9800,#f57c00);color:white;padding:30px;text-align:center}
.header h1{font-size:2em;margin:0}
.header h2{font-size:1.6em;margin:10px 0 0 0;font-weight:bold}
.content{padding:30px}
.week-header{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:15px 20px;border-radius:10px;margin:25px 0 15px 0;font-size:1.1em;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.week-header .count{background:rgba(255,255,255,0.2);padding:5px 12px;border-radius:15px;font-size:0.85em}
.week-table{width:100%;border-collapse:collapse;margin-bottom:30px;background:white;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.week-table th{background:#f5f5f5;padding:12px 8px;text-align:center;font-weight:bold;border-bottom:2px solid #ddd;font-size:0.9em}
.week-table th.question-col{text-align:left;min-width:200px;background:#667eea;color:white}
.week-table th.day-col{min-width:70px}
.week-table td{padding:10px 8px;text-align:center;border-bottom:1px solid #eee}
.week-table td.question-cell{text-align:left;font-weight:500;background:#f9f9f9}
.week-table tr:hover td{background:#f5f5f5}
.week-table tr:hover td.question-cell{background:#e8e8e8}
.yes-cell{color:#4caf50;font-weight:bold}
.no-cell{color:#f44336;font-weight:bold}
.empty-cell{color:#ccc}
.refresh-btn{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:12px 24px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-bottom:20px}
.refresh-btn:hover{opacity:0.9}
.no-data{text-align:center;padding:40px;color:#666;font-style:italic}
.legend{display:flex;gap:20px;margin-bottom:20px;padding:15px;background:#f9f9f9;border-radius:8px}
.legend-item{display:flex;align-items:center;gap:8px}
.legend-yes{color:#4caf50;font-weight:bold}
.legend-no{color:#f44336;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>Daytoday Real Time SOW Status</h1>
<h2>Site: 33-carlisle-st-rose-bay</h2>
<p style="margin:10px 0 0 0;opacity:0.9">📅 Results displayed in weekly tables (Tasks × Days)</p>
</div>
<div class="content">
<button class="refresh-btn" onclick="loadHistory()">🔄 Refresh Data</button>
<div class="legend"><span style="font-weight:bold">Legend:</span><div class="legend-item"><span class="legend-yes">✓ Yes</span></div><div class="legend-item"><span class="legend-no">✗ No</span></div><div class="legend-item"><span style="color:#ccc">— No submission</span></div></div>
<div id="history">Loading...</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL="https://hkrktfmvxgctjeivmobz.supabase.co";
var SUPABASE_KEY="sb_publishable_a5_CAmMfSQrlVzUy3YhUWw_IQHb4RBy";
var SITE_ID="33-carlisle-st-rose-bay";
var supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var questions=[
{id:"q1",label:"Vacuuming and mopping floors Due to the rough surface of the tiles we need to allocate more time than usual to mop them. - Weekly"},
{id:"q2",label:"Polishing foyer glass doors and glass panels x 2 foyers. - Weekly"},
{id:"q3",label:"Wiping down balustrades, handrails, power points, light switches. - Weekly"},
{id:"q4",label:"Wiping down light fittings - As required"},
{id:"q5",label:"Polishing lift and lift tracks x 2 lifts. - Weekly"},
{id:"q6",label:"Cleaning internal windows and windowsills. - Weekly"},
{id:"q7",label:"Removing cobwebs throughout the SP, internally and externally. - Weekly"},
{id:"q8",label:"Collecting rubbish throughout the SP, internally and externally. - Weekly"},
{id:"q9",label:"Wiping down intercoms. - Weekly"},
{id:"q10",label:"Wiping down letterboxes and removing junk mail. - Weekly"},
{id:"q11",label:"Deodorising hallways. - Weekly"},
{id:"q12",label:"Removing marks from walls (where possible) - As required"},
{id:"q1768463790982",label:"Clearing stormwater drains. - Weekly"},
{id:"q1768463809267",label:"Air blowing footpath and driveway, and collecting foliage - Weekly"},
{id:"q1768463826270",label:"Relocating bins for collections and returning the next day, Wednesday to Thursday. Bins to be relocated via the driveway. - Weekly"},
{id:"q1768463840276",label:"Washing bins and bin room. - Weekly"},
{id:"q1768463854570",label:"Washing the carpark - Quarterly"},
{id:"q1768463869812",label:"Heavy-duty scrubbing of all tiles internally and externally - Quarterly"},
{id:"q1768463892064",label:"High pressure cleaning service of the bin room - Quarterly"}
];
var dayNames=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var fullDayNames=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
function getWeekMonday(date){var d=new Date(date);var day=d.getDay();var diff=d.getDate()-day+(day===0?-6:1);d.setDate(diff);d.setHours(0,0,0,0);return d;}
function getWeekSunday(monday){var d=new Date(monday);d.setDate(d.getDate()+6);return d;}
function formatWeekDate(date){var months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return months[date.getMonth()]+" "+date.getDate();}
function getWeekKey(date){var monday=getWeekMonday(date);return monday.getFullYear()+"-"+String(monday.getMonth()+1).padStart(2,"0")+"-"+String(monday.getDate()).padStart(2,"0");}
function getDayIndex(date){var d=new Date(date);var day=d.getDay();return day===0?6:day-1;}
function loadHistory(){supabase.from("submissions").select("*").eq("site_id",SITE_ID).order("timestamp",{ascending:false}).then(function(result){
if(result.error){document.getElementById("history").innerHTML="<p class=\"no-data\">Error loading data</p>";return;}
if(result.data.length===0){document.getElementById("history").innerHTML="<p class=\"no-data\">No submissions yet</p>";return;}
var weeks={};
result.data.forEach(function(sub){
var dt=new Date(sub.timestamp);
var weekKey=getWeekKey(dt);
var dayIdx=getDayIndex(dt);
if(!weeks[weekKey]){weeks[weekKey]={monday:getWeekMonday(dt),days:[[],[],[],[],[],[],[]]};};
weeks[weekKey].days[dayIdx].push(sub);
});
var sortedWeeks=Object.keys(weeks).sort().reverse();
var html="";
sortedWeeks.forEach(function(weekKey){
var week=weeks[weekKey];
var monday=week.monday;
var sunday=getWeekSunday(monday);
var weekLabel="Week of "+formatWeekDate(monday)+" - "+formatWeekDate(sunday);
if(monday.getFullYear()!==sunday.getFullYear()){weekLabel+=", "+sunday.getFullYear();}else{weekLabel+=", "+monday.getFullYear();}
var totalSubs=0;week.days.forEach(function(d){totalSubs+=d.length;});
html+="<div class=\"week-header\"><span>📅 "+weekLabel+"</span><span class=\"count\">"+totalSubs+" submission"+(totalSubs!==1?"s":"")+"</span></div>";
html+="<table class=\"week-table\">";
html+="<thead><tr><th class=\"question-col\">Task</th>";
for(var d=0;d<7;d++){
var dayDate=new Date(monday);dayDate.setDate(dayDate.getDate()+d);
var dateStr=dayDate.getDate()+"/"+(dayDate.getMonth()+1);
html+="<th class=\"day-col\">"+dayNames[d]+"<br><span style=\"font-weight:normal;font-size:0.8em;color:#666\">"+dateStr+"</span></th>";
}
html+="</tr></thead>";
html+="<tbody>";
questions.forEach(function(q){
html+="<tr><td class=\"question-cell\">"+q.label+"</td>";
for(var d=0;d<7;d++){
var daySubs=week.days[d];
if(daySubs.length===0){html+="<td class=\"empty-cell\">—</td>";}
else if(daySubs.length===1){
var ans=daySubs[0].responses[q.id];
html+="<td class=\""+((ans)?"yes-cell":"no-cell")+"\">"+(ans?"✓":"✗")+"</td>";
}
else{
var latestAns=daySubs[0].responses[q.id];
html+="<td class=\""+((latestAns)?"yes-cell":"no-cell")+"\">"+(latestAns?"✓":"✗")+"</td>";
}
}
html+="</tr>";
});
html+="</tbody></table>";
});
document.getElementById("history").innerHTML=html;
});}
loadHistory();
</script>
</body>
</html>
