<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Results - testsite1</title>
<style>
body{font-family:Arial;background:#5f7a94;min-height:100vh;padding:20px;margin:0}
.container{max-width:900px;margin:0 auto;background:white;border-radius:15px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,0.2)}
.header{background:linear-gradient(135deg,#ff9800,#f57c00);color:white;padding:30px;text-align:center}
.header h1{font-size:2em;margin:0}
.header h2{font-size:1.6em;margin:10px 0 0 0;font-weight:bold}
.content{padding:30px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>Daytoday SOW Submissions</h1>
<h2>Site: testsite1</h2>
</div>
<div class="content">
<h3>Submission History</h3>
<div id="history">Loading...</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL="https://hkrktfmvxgctjeivmobz.supabase.co";
var SUPABASE_KEY="sb_publishable_a5_CAmMfSQrlVzUy3YhUWw_IQHb4RBy";
var SITE_ID="testsite1";
var supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var questions=[
{id:"q1",label:"Enable email notifications"},
{id:"q2",label:"Subscribe to newsletter"},
{id:"q3",label:"Enable two-factor authentication"},
{id:"q4",label:"Make profile public"},
{id:"q5",label:"Allow data sharing with partners"},
{id:"q6",label:"Enable usage analytics"},
{id:"q7",label:"Receive SMS alerts"},
{id:"q8",label:"Enable push notifications"},
{id:"q9",label:"Receive weekly digest"},
{id:"q10",label:"Enable dark mode"},
{id:"q11",label:"Enable auto-save"},
{id:"q12",label:"Enable beta features"}
];
function loadHistory(){supabase.from("submissions").select("*").eq("site_id",SITE_ID).order("timestamp",{ascending:false}).then(function(result){
if(result.error){document.getElementById("history").innerHTML="<p>Error loading</p>";return;}
if(result.data.length===0){document.getElementById("history").innerHTML="<p>No submissions yet</p>";return;}
var html="";
result.data.forEach(function(sub,i){
var dt=new Date(sub.timestamp);
var dateStr=dt.toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
var timeStr=dt.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});
html+="<div style=\"padding:15px;margin:10px 0;background:#f9f9f9;border-radius:8px;border-left:4px solid #667eea;cursor:pointer;transition:all 0.2s\" onmouseover=\"this.style.background='#e3f2fd'\" onmouseout=\"this.style.background='#f9f9f9'\" onclick=\"showSubmission("+i+")\">";
html+="<div style=\"display:flex;justify-content:space-between;align-items:center\">";
html+="<div><strong style=\"font-size:1.1em;color:#667eea\">Submission #"+(result.data.length-i)+"</strong><br>";
html+="<span style=\"color:#666\">"+dateStr+"</span></div>";
html+="<div style=\"text-align:right\"><span style=\"color:#999;font-size:0.9em\">"+timeStr+"</span><br>";
html+="<span style=\"color:#667eea;font-weight:bold\">View →</span></div>";
html+="</div></div>";});
document.getElementById("history").innerHTML=html;
window.allSubmissions=result.data;});}
function showSubmission(index){var sub=window.allSubmissions[index];
var dt=new Date(sub.timestamp);
var dateStr=dt.toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"});
var html="<button onclick=\"loadHistory()\" style=\"padding:10px 20px;background:#667eea;color:white;border:none;border-radius:6px;cursor:pointer;margin-bottom:20px\">← Back to List</button>";
html+="<div style=\"background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1)\">";
html+="<h3 style=\"color:#667eea;margin:0 0 5px 0\">Submission #"+(window.allSubmissions.length-index)+"</h3>";
html+="<p style=\"color:#666;margin:0 0 20px 0\">"+dateStr+"</p>";
html+="<div style=\"display:grid;gap:10px\">";
questions.forEach(function(q){var ans=sub.responses[q.id];
html+="<div style=\"display:flex;justify-content:space-between;padding:12px;background:#f9f9f9;border-radius:6px\">";
html+="<span>"+q.label+"</span>";
html+="<strong style=\"color:"+(ans?"#4caf50":"#f44336")+"\">"+(ans?"Yes":"No")+"</strong>";
html+="</div>";});
html+="</div></div>";
document.getElementById("history").innerHTML=html;}
loadHistory();
</script>
</body>
</html>
