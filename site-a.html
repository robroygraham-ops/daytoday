<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SOE Form - Site A</title>
<style>
body{font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px;margin:0}
.container{max-width:900px;margin:0 auto;background:white;border-radius:15px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,0.2)}
.header{background:linear-gradient(135deg,#4facfe,#00f2fe);color:white;padding:30px;text-align:center}
.header h1{font-size:2em;margin:0}
.header h2{font-size:1.3em;margin:10px 0 0 0}
.tabs{display:flex;background:#f5f5f5}
.tab{flex:1;padding:15px;text-align:center;cursor:pointer;font-weight:bold;background:#e0e0e0;border:none;font-size:1em}
.tab.active{background:white;color:#667eea}
.content{padding:30px}
.section{margin-bottom:30px}
.section h3{font-size:1.5em;color:#333;margin:0 0 15px 0;padding-bottom:8px;border-bottom:2px solid #eee}
.question{display:flex;justify-content:space-between;align-items:center;padding:15px;margin:10px 0;background:#f9f9f9;border-radius:8px}
.question label{flex:1;font-size:1.05em}
.buttons{display:flex;gap:8px}
.btn{padding:8px 20px;border:none;border-radius:20px;font-weight:bold;cursor:pointer;font-size:0.95em}
.btn-yes{background:#4caf50;color:white}
.btn-no{background:#f44336;color:white}
.btn.active{box-shadow:0 0 0 3px rgba(0,0,0,0.2);transform:scale(1.05)}
.btn.inactive{background:#ccc;opacity:0.5}
.submit-btn{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:15px 40px;border:none;border-radius:25px;font-size:1.2em;font-weight:bold;cursor:pointer;margin:20px auto;display:block}
.message{padding:15px;margin-bottom:20px;border-radius:8px;text-align:center;font-weight:bold}
.success{background:#d4edda;color:#155724}
.error{background:#f8d7da;color:#721c24}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>Daytoday SOE Form</h1>
<h2>Site: Site A</h2>
</div>
<div class="tabs">
<button class="tab active" id="tab1" onclick="switchTab(1)">Submit Form</button>
<button class="tab" id="tab2" onclick="switchTab(2)">View History</button>
</div>
<div class="content">
<div id="formTab">
<div id="msg"></div>
<div id="form"></div>
<button class="submit-btn" onclick="submitForm()">Submit Form</button>
</div>
<div id="historyTab" class="hidden">
<h3>Submission History</h3>
<div id="history">Loading...</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL="https://hkrktfmvxgctjeivmobz.supabase.co";
var SUPABASE_KEY="sb_publishable_a5_CAmMfSQrlVzUy3YhUWw_IQHb4RBy";
var SITE_ID="site-a";
var SITE_NAME="Site A";
var supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var questions=[
{id:"q3",label:"Enable two-factor authentication"},
{id:"q1",label:"Enable email notifications"},
{id:"q2",label:"Subscribe to newsletter"},
{id:"q4",label:"Make profile public"},
{id:"q5",label:"Allow data sharing with partners"},
{id:"q6",label:"Enable usage analytics"},
{id:"q7",label:"Receive SMS alerts"},
{id:"q8",label:"Enable push notifications"},
{id:"q9",label:"Receive weekly digest"},
{id:"q10",label:"Enable dark mode"},
{id:"q11",label:"Enable auto-save"},
{id:"q12",label:"Enable beta features"}
];
var answers={};
function renderForm(){
var html="";
for(var i=0;i<questions.length;i++){
var q=questions[i];
var yc=answers[q.id]===true?"active":(answers[q.id]===false?"inactive":"");
var nc=answers[q.id]===false?"active":(answers[q.id]===true?"inactive":"");
html+="<div class=\"question\">";
html+="<label>"+q.label+"</label>";
html+="<div class=\"buttons\">";
html+="<button class=\"btn btn-yes "+yc+"\" onclick=\"setAnswer('"+q.id+"',true)\">Yes</button>";
html+="<button class=\"btn btn-no "+nc+"\" onclick=\"setAnswer('"+q.id+"',false)\">No</button>";
html+="</div></div>";
}
document.getElementById("form").innerHTML=html;
}
function setAnswer(qid,val){answers[qid]=val;renderForm();}
function showMsg(text,type){
var box=document.getElementById("msg");
box.innerHTML="<div class=\"message "+type+"\">"+text+"</div>";
if(type==="success")setTimeout(function(){box.innerHTML="";},3000);
}
function submitForm(){
var missing=[];
for(var i=0;i<questions.length;i++){
if(answers[questions[i].id]===undefined)missing.push(questions[i]);
}
if(missing.length>0){showMsg("Please answer all questions ("+missing.length+" remaining)","error");return;}
supabase.from("submissions").insert({site_id:SITE_ID,site_name:SITE_NAME,responses:answers,timestamp:new Date().toISOString()}).then(function(result){
if(result.error){showMsg("Error: "+result.error.message,"error");}
else{showMsg("Form submitted successfully!","success");answers={};renderForm();setTimeout(function(){switchTab(2);},2000);}
});
}
function switchTab(num){
document.getElementById("tab1").classList.remove("active");
document.getElementById("tab2").classList.remove("active");
document.getElementById("formTab").classList.add("hidden");
document.getElementById("historyTab").classList.add("hidden");
if(num===1){document.getElementById("tab1").classList.add("active");document.getElementById("formTab").classList.remove("hidden");}
else{document.getElementById("tab2").classList.add("active");document.getElementById("historyTab").classList.remove("hidden");loadHistory();}
}
function loadHistory(){
supabase.from("submissions").select("*").eq("site_id",SITE_ID).order("timestamp",{ascending:false}).then(function(result){
if(result.error){document.getElementById("history").innerHTML="<p>Error loading</p>";return;}
if(result.data.length===0){document.getElementById("history").innerHTML="<p>No submissions yet</p>";return;}
var html="";
result.data.forEach(function(sub,i){
html+="<div style=\"background:#f9f9f9;padding:15px;margin:10px 0;border-radius:8px\">";
html+="<strong>Submission #"+(result.data.length-i)+" - "+new Date(sub.timestamp).toLocaleString()+"</strong><br><br>";
questions.forEach(function(q){
var ans=sub.responses[q.id];
html+=q.label+": <strong style=\"color:"+(ans?"#4caf50":"#f44336")+"\">"+(ans?"Yes":"No")+"</strong><br>";
});
html+="</div>";
});
document.getElementById("history").innerHTML=html;
});
}
renderForm();
</script>
</body>
</html>
